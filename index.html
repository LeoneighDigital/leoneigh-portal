<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leoneigh · Client Operations</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <aside class="rail">
    <div class="rail-brand">
      <img class="rb-mark" src="assets/Profile.jpg" alt="Leoneigh logo">
      <span class="rb-text">LEONEIGH</span>
    </div>
    <div class="rb-sub">CLIENT OPERATIONS</div>

    <div class="rail-label">TENANTS</div>
    <nav class="rail-nav" id="switcher"></nav>

    <div class="rail-foot">
      <div class="rf-row"><span class="rf-dot"></span>SYNCED</div>
      <div class="rf-row">v2.4.1</div>
    </div>
  </aside>

  <main class="main">
    <header class="masthead" id="masthead"></header>

    <section class="block" id="sprintBlock"></section>
    <section class="block" id="retainerBlock"></section>
    <section class="block" id="ledgerBlock"></section>

    <div class="split">
      <section class="block" id="feedBlock"></section>
      <section class="block" id="registerBlock"></section>
    </div>

    <div class="page-foot">
      <span>LEONEIGH DIGITAL · CLIENT OPERATIONS · READ-ONLY AUDIT</span>
      <span class="pf-r"><span>LOG SEALED</span><span>RETENTION 24 MO</span></span>
    </div>
  </main>

</div>

<script src="app.js"></script>
</body>
</html>
