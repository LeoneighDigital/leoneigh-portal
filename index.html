<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leoneigh · Client Operations</title>
  <link rel="icon" type="image/x-icon" href="assets/Profile.jpg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <aside class="rail">
    <div class="rail-brand">
      <img class="rb-mark" src="assets/Profile.jpg" alt="Leoneigh logo">
      <span class="rb-text">LEONEIGH</span>
    </div>
    <div class="rb-sub">CLIENT OPERATIONS</div>

    <div class="rail-label">TENANTS</div>
    <nav class="rail-nav" id="switcher"></nav>

    <div class="rail-foot">
      <div class="rf-row"><span class="rf-dot"></span>SYNCED</div>
      <div class="rf-row">v2.4.1</div>
    </div>
  </aside>

  <main class="main">
    <header class="masthead" id="masthead"></header>

    <section class="block" id="sprintBlock"></section>
    <section class="block" id="retainerBlock"></section>
    <section class="block" id="ledgerBlock"></section>

    <div class="split">
      <section class="block" id="feedBlock"></section>
      <section class="block" id="registerBlock"></section>
    </div>

    <div class="page-foot">
      <span>LEONEIGH DIGITAL · CLIENT OPERATIONS · SIGN-OFF SIMULATION</span>
      <span class="pf-r"><span>LOCAL DEMO LOG</span><span>RETENTION 24 MO</span></span>
    </div>
  </main>

</div>

<div class="recap-drawer" id="recapDrawer" aria-hidden="true">
  <div class="rd-backdrop" data-close></div>
  <div class="rd-card" role="dialog" aria-modal="true" aria-labelledby="rd-title">
    <header class="rd-head">
      <div>
        <div class="rd-eyebrow">ASYNC RECAP · STAGING · LIVE</div>
        <h2 id="rd-title" class="rd-title">—</h2>
        <div class="rd-meta">—</div>
      </div>
      <button class="rd-x" data-close aria-label="Close">×</button>
    </header>
    <div class="rd-video">
      <div class="rd-player">
        <div class="rd-play"><span></span></div>
        <div class="rd-caption">Loom / video player · streaming in live portal</div>
      </div>
    </div>
    <footer class="rd-foot">
      <span>Transcript attached</span>
      <span class="rd-esc">ESC to close</span>
    </footer>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
